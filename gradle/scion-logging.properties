# Default SCION backend logging for Android debug builds.
#
# Debug builds use these values. Release builds are hardcoded to safe defaults
# (level=info, no components, no dumps) regardless of this file.
#
# To override locally without modifying tracked files, create:
#   gradle/scion-logging.local.properties
# That file is gitignored and takes priority over these defaults.

# SCION log verbosity. Messages below this level are suppressed.
# Valid values: trace, debug, info, warn, warning, error
scionLogLevel=error

# SCION log component filter. Comma-separated list of components to enable.
#   empty  = no component log messages (effectively silent for SCION)
#   all    = every component enabled
#   list   = only the listed components are active
#
# Component descriptions:
#   init              One-time setup: SCION config parsing, topology loading,
#                     path-srv dial checks, daemon connector init.
#   path              Path lookup, cache hit/miss, async refresh events,
#                     path selection decisions.
#   path-engine       Detailed trace of the embedded path engine's sub-phases
#                     (LocalIA, Interfaces, Paths) per retrieval call.
#   pending           Queued packet flush events when paths become ready.
#   translate-egress  SCION packet construction: host mapping, path building,
#                     outer IP/UDP encapsulation.
#   wireguard-egress  WireGuard device-level egress routing decisions through
#                     the SCION outbound pipeline.
#   egress-lifecycle  Connection lifecycle tracking across egress state
#                     transitions (init, wait, active, cleanup).
scionLogComponents=init

# Binary feature flags for detailed SCION dump logging (all false by default).
scionLogFullTopology=false
scionLogPacketBytes=false
scionLogPathBytes=false
scionLogInternalStructs=false

# Core WireGuard daemon log verbosity. Controls the base device.Logger output,
# which logs handshakes, peer events, packet events, etc.
# Valid values: verbose (all messages), error (errors only), silent (no output)
wireguardCoreLogLevel=error
